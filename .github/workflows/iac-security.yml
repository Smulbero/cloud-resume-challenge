name: IaC Security (tfsec + checkov)

on:
  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/terraform/**/*.tf"

permissions:
  id-token: write
  contents: read
  security-events: write
  
jobs:
  tfsec:
    name: tfsec (code scan)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./infrastructure/terraform
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1
        with:
          additional_args: >
            --concise-output
            --format sarif
            --out tfsec.sarif

      - name: Upload SARIF (tfsec)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec.sarif
          
  checkov:
    name: checkov
    runs-on: ubuntu-latest

    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}

    defaults:
      run:
        working-directory: ./infrastructure/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"
     
      - name: Terraform Init
        run: terraform init -input=false
          
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=deploy.tfplan

      - name: Convert plan to JSON
        run: terraform show -json deploy.tfplan > checkov.json

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          file: infrastructure/terraform/checkov.json
          framework: terraform_plan
          repo_root_for_plan_enrichment: infrastructure/terraform
          soft_fail: false
          output_format: sarif
          output_file_path: checkov.sarif

      - name: Upload SARIF (Checkov)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
