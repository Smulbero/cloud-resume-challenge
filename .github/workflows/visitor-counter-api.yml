name: Test the visitor counter API

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/api/*.py"

jobs:
  api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: | 
          pip install -r ${{ github.workspace }}/backend/api/requirements.txt
          pip install -r ${{ github.workspace }}/backend/api/requirements-test.txt      
      
      - name: Run the tests
        run: | 
          pytest ${{ github.workspace }}/backend/api/tests/test_visitor_counter.py