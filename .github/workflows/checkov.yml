name: Terraform vulnerability scan

on:
  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/terraform/**/*.tf"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./infrastructure/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"
     
      - name: Terraform Init
        run: terraform init -input=false
          
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=deploy.tfplan

      - name: Convert plan to JSON
        run: terraform show -json deploy.tfplan > checkov.json

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          file: infrastructure/terraform/checkov.json
          framework: terraform_plan
          repo_root_for_plan_enrichment: infrastructure/terraform
          deep_analysis: true